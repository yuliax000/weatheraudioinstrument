<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>weather instrument</title>



    <link rel="icon" type="image/png" href="./assets/icons8-partly-cloudy-day-48.png">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>

</head>
<body>


<!--dialog structure: 3 pages
headphone reminder - interaction (mouse and keyboard) - replay function reminder -->
<!--simple words!!!-->
<dialog id="introDialog">

    <button id="introSkipButton" type="button">Play now</button>
    <section class="introPage">
        <div class="introImages">


            <img id="introMouse" class="introImage"
                 src="assets/handCursor.png" alt="Mouse" hidden>
            <img id="introImage" class="introImage" src="" alt="">
        </div>

        <h2 id="introTitle"></h2>
        <p id="introText"></p>

        <ul id="introKeyGuide" hidden>
            <li>
                <img src="assets/sun100.png" alt="">
                <span>Sun: Q W A S Z X</span>
            </li>
            <li>
                <img src="assets/water100.png" alt="">
                <span>Rain: E R D F C V</span>
            </li>
            <li>
                <img src="assets/thunder100.png" alt="">
                <span>Thunder: T Y U G H J B N</span>
            </li>
            <li>
                <img src="assets/leaf100.png" alt="">
                <span>Wind: I O P K L M</span>
            </li>
        </ul>
    </section>
<!--    </section>-->

    <section class="introActions">

        <button id="introButtonClose" autofocus>Next</button>
    </section>

</dialog>





<!--adding replay/stop/clear button-->
 <section class="controlPanel">

     <button
             id="helpButton"
             class="iconButton"
             type="button"
             aria-label="Show instructions"
             aria-haspopup="dialog"
             aria-controls="introDialog">

         <img src="./assets/question-mark1.png" alt="question">
     </button>

     <section class="playBackControls">
         <button class="iconButton" id="replayButton" type="button"
         >
             <img src="./assets/play.png" alt="replay">
         </button>


         <button class="iconButton" id="stopButton" type="button">
             <img src="./assets/stop.png" alt="stop">
         </button>

         <button class="iconButton" id="clearButton" type="button">
             <img src="./assets/clear.png" alt="clear">
         </button>
     </section>



     <!-- adding volume controller-->
     <!-- Compared with an abstract circular slider, I think a more recognisable icon can help children understand the intended interaction more clearly. Therefore, I decided to add a hand icon below the volume slider as a visual cue.-->
     <section class="volumeControl">
         <img class="volumeIcon" src="./assets/volume.png" alt="">

         <div class="sliderWrap">
             <input id="volumeSlider" type="range" min="0" max="100" value="80">
             <img id="volumeHand" src="./assets/finger.png" alt="">
         </div>
     </section>









     </section>












<!-- <header>-->
<!--    <h1>Audio instrument</h1>-->
<!--</header>-->
<main>
<!--    <button id="testButton">sound check</button>-->

<!--    add the container-->

    <section class="weatherContainer">
        <section class="weather sunContainer" id="sunContainer">
            <img class="weatherIcon"
                id="sunIcon" src="assets/sun100.png" alt="sun">
        </section>
        <section class="weather rainContainer" id="rainContainer">
            <img class="weatherIcon" id="rainIcon" src="assets/water100.png" alt="rain">
        </section>
        <section class="weather thunderContainer" id="thunderContainer">
            <img class="weatherIcon"  id="thunderIcon"  src="assets/thunder100.png" alt="thunder">
        </section>
        <section class="weather windContainer" id="windContainer">
            <img class="weatherIcon" id="windIcon" src="assets/leaf100.png" alt="leaf">
        </section>

    </section>
    <section class="drumContainer" id="drumContainer">
<!--        <img class="weatherIcon" id="grassIcon" src="assets/grass.png" alt="grass">-->
    </section>
</main>


</body>
</html>
